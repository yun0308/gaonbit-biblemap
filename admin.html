<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>관리자 · 가온빛교회 성경 읽기·필사 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF7F0; --cream-2:#FFFFFF;
  --navy:#1B2A4A; --navy-soft:#5B6A87;
  --gold:#C9A961; --line:#E7E0CE;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--cream);color:var(--navy);line-height:1.6;font-size:16px;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:800px;margin:0 auto;padding:0 18px 60px}

header{background:var(--navy);color:var(--cream);padding:26px 20px 22px;text-align:center}
header .eyebrow{letter-spacing:.15em;font-size:11px;color:#E8D9B5;text-transform:uppercase;font-weight:600;margin-bottom:.5rem}
header h1{font-family:'Gowun Batang',serif;font-size:22px;font-weight:700}

/* ===== 키 입력 화면 ===== */
#gate{max-width:400px;margin:60px auto;padding:0 20px}
#gate .field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
#gate input{
  width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--cream-2);font-size:16px;
}
#gate button{
  width:100%;padding:15px;margin-top:14px;background:var(--navy);color:var(--cream);
  border-radius:var(--r);font-size:16px;font-weight:700;
}
#gate .err{color:#A8442F;font-size:13.5px;margin-top:10px;display:none}

/* ===== 대시보드 ===== */
#dash{display:none}
.toolbar{
  display:flex;gap:10px;align-items:center;margin:20px 0 16px;flex-wrap:wrap;
}
.toolbar select, .toolbar button{
  padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;
  background:var(--cream-2);font-size:14px;font-weight:600;
}
.toolbar .refresh{color:var(--navy-soft)}
.toolbar .spacer{flex:1}

.summary{
  display:flex;gap:1px;background:#DFDAC6;border-radius:10px;overflow:hidden;
  box-shadow:0 4px 16px rgba(27,42,74,.08);margin-bottom:18px;
}
.summary .s{flex:1;background:#fff;padding:16px 10px;text-align:center}
.summary .s .v{font-size:24px;font-weight:800;color:#1F2B46}
.summary .s .k{font-size:12px;color:#8D8B83;margin-top:4px}
@media (max-width:640px){
  .summary{display:grid;grid-template-columns:1fr 1fr}
  .summary .s{border-bottom:1px solid #DFDAC6}
  .summary .s:nth-child(3),.summary .s:nth-child(4){border-bottom:none}
  .summary .s .k{white-space:nowrap;font-size:11px}
}

.birth-tag{
  font-size:11.5px;font-weight:600;color:var(--navy-soft);
  background:var(--cream);border:1px solid var(--line);border-radius:5px;
  padding:2px 6px;margin-left:6px;font-variant-numeric:tabular-nums;
}

/* ===== 대분류 섹션 (읽기 진도 / 필사 진도) ===== */
.act-section{margin-bottom:32px}
.act-heading{
  font-family:'Gowun Batang',serif;font-size:19px;font-weight:700;
  padding:10px 0;margin-bottom:10px;border-bottom:2px solid var(--navy);
}
.act-heading-read{color:var(--navy)}
.act-heading-write{color:#8A6A1E;border-bottom-color:var(--gold)}

.person-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.person-row{
  background:var(--cream-2);padding:12px 16px;
  display:grid;
  grid-template-columns:130px 1fr 1fr 90px 64px;
  align-items:center;column-gap:14px;
}
.person-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-updated{font-size:11.5px;color:#B7AF9C;white-space:nowrap;text-align:right}

/* 구약/신약 각각 한 칸씩 — person-row가 grid라 항상 한 줄 유지 */
.t-cell{display:flex;align-items:center;gap:7px;min-width:0}
.t-label{font-size:11.5px;font-weight:700;color:var(--navy-soft);flex:0 0 26px}
.t-empty .t-none{font-size:12px;color:#C7BFA6}

.bar-mini{width:52px;flex:0 0 52px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar-mini i{display:block;height:100%}
.pct{font-size:12px;color:var(--navy-soft);white-space:nowrap}
.pct .cnt{color:#B7AF9C;font-size:10.5px;display:block}

.btn-del-mini{
  font-size:11.5px;font-weight:600;color:#A8442F;
  padding:6px 10px;border:1px solid #E3B8A8;border-radius:6px;background:#FBF0ED;
  white-space:nowrap;
}
.btn-del-mini:disabled{opacity:.5}

.empty{text-align:center;padding:50px 20px;color:var(--navy-soft)}
.loading{text-align:center;padding:50px 20px;color:var(--navy-soft)}

@media (max-width:720px){
  .person-row{
    grid-template-columns:1fr 1fr;
    grid-template-areas:
      "name    name"
      "ot      nt"
      "updated del";
    row-gap:8px;
  }
  .person-name{grid-area:name}
  .person-row .t-ot{grid-area:ot}
  .person-row .t-nt{grid-area:nt}
  .person-updated{grid-area:updated;text-align:left}
  .btn-del-mini{grid-area:del;justify-self:end}
  .t-cell{flex-wrap:wrap;row-gap:2px;min-width:0}
  .t-label{flex:0 0 auto}
  .bar-mini{width:36px;flex:0 0 36px}
  .pct{display:block;width:100%;padding-left:33px;font-size:11.5px}
  .pct .cnt{display:inline}
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">가온빛교회 · 관리자</div>
  <h1>참여자 진도 현황</h1>
</header>

<div id="gate">
  <div class="field">
    <label for="f-key">관리자 키</label>
    <input id="f-key" type="password" placeholder="Apps Script에 설정한 ADMIN_KEY">
  </div>
  <button id="btn-enter">조회</button>
  <p class="err" id="gate-err">키가 올바르지 않거나 연결에 실패했습니다.</p>
</div>

<div id="dash">
  <div class="wrap">
    <div class="toolbar">
      <span class="spacer"></span>
      <button class="refresh" id="btn-refresh">새로고침</button>
    </div>

    <div class="summary" id="summary"></div>

    <div id="sections"></div>
  </div>
</div>

<script>
/* Apps Script 웹앱 URL — index.html과 동일한 값을 넣으세요 */
const API_URL = 'https://script.google.com/macros/s/AKfycbzHjZ10cYdtHiHeVCf5qy65cKwHT7AmRb9ZeghiTrW-2KQ7xlcjdpkMJ0RkdN9Znkgc/exec';

const $ = s => document.querySelector(s);
let adminKey = '';
let rows = [];       // API 원본 (사람×성경 단위)
let people = [];     // 사람 단위로 합친 것: {name, birth, ot:{...}|null, nt:{...}|null, last_updated}

$('#btn-enter').addEventListener('click', load);
$('#f-key').addEventListener('keydown', e=>{ if(e.key==='Enter') load(); });

async function load(){
  const key = $('#f-key').value.trim();
  if(!key) return;
  adminKey = key;
  $('#gate-err').style.display = 'none';

  try{
    const q = new URLSearchParams({ action:'getAllProgress', admin_key: adminKey, _: Date.now() });
    const res = await fetch(API_URL + '?' + q, { cache: 'no-store' });
    const json = await res.json();
    if(!json.ok){
      $('#gate-err').textContent = json.error.message || '조회에 실패했습니다.';
      $('#gate-err').style.display = 'block';
      return;
    }
    rows = json.data.users || [];
    people = groupByPerson(rows);
    $('#gate').style.display = 'none';
    $('#dash').style.display = 'block';
    render();
  }catch(e){
    $('#gate-err').textContent = '연결에 실패했습니다. API 주소나 네트워크를 확인해주세요.';
    $('#gate-err').style.display = 'block';
  }
}

$('#btn-refresh').addEventListener('click', load);

/* 사람(이름+생일) 단위로 구약/신약 데이터를 하나로 합침 */
function groupByPerson(list){
  const map = {};
  list.forEach(u=>{
    const key = u.name + '|' + u.birth_date;
    if(!map[key]) map[key] = { name:u.name, birth_date:u.birth_date, ot:null, nt:null, last_updated:'' };
    const slot = u.testament === 'OT' ? 'ot' : 'nt';
    map[key][slot] = u;
    if(!map[key].last_updated || (u.last_updated && u.last_updated > map[key].last_updated)){
      map[key].last_updated = u.last_updated;
    }
  });
  return Object.values(map).sort((a,b)=> a.name.localeCompare(b.name));
}

$('#sections').addEventListener('click', async e=>{
  const btn = e.target.closest('.btn-del-mini');
  if(!btn) return;

  const name = btn.dataset.name, birth = btn.dataset.birth;
  if(!confirm(`${name}님의 진도를 구약·신약 모두 완전히 삭제합니다.\n이 작업은 되돌릴 수 없습니다.\n\n계속할까요?`)) return;

  btn.disabled = true;
  btn.textContent = '삭제 중…';

  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: 'adminDeleteUser',
        admin_key: adminKey,
        name, birth_date: birth
        // testament 생략 → 구약+신약 전체 삭제
      })
    });
    const json = await res.json();
    if(json.ok){
      rows = rows.filter(u => !(u.name===name && u.birth_date===birth));
      people = groupByPerson(rows);
      render();
    }else{
      alert('삭제하지 못했습니다: ' + json.error.message);
      btn.disabled = false; btn.textContent = '삭제';
    }
  }catch(e){
    alert('연결에 실패했습니다.');
    btn.disabled = false; btn.textContent = '삭제';
  }
});

function render(){
  renderSummary();

  const sections = $('#sections');
  if(!people.length){
    sections.innerHTML = `<div class="empty">아직 참여자 데이터가 없습니다.</div>`;
    return;
  }

  sections.innerHTML = ['read','write'].map(mode=>{
    const modeKor = mode==='read' ? '읽기' : '필사';
    // 이 활동(읽기 또는 필사)을 구약·신약 어느 쪽으로도 한 번도 안 한 사람은 이 섹션에서 아예 제외
    const modePeople = people.filter(p => hasActivity(p.ot, mode) || hasActivity(p.nt, mode));

    if(!modePeople.length){
      return `<section class="act-section">
        <h2 class="act-heading act-heading-${mode}">${modeKor} 진도</h2>
        <div class="empty">아직 ${modeKor} 기록이 있는 참여자가 없습니다.</div>
      </section>`;
    }

    const rowsHtml = modePeople.map(p=>{
      const updated = p.last_updated ? new Date(p.last_updated).toLocaleDateString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
      const delBtn = `<button class="btn-del-mini" title="구약+신약 데이터 전체 삭제" data-name="${esc(p.name)}" data-birth="${esc(p.birth_date)}">삭제</button>`;
      return `<div class="person-row">
        <div class="person-name">${esc(p.name)}<span class="birth-tag">${esc(p.birth_date)}</span></div>
        ${testamentCell(p.ot, 'OT', mode)}
        ${testamentCell(p.nt, 'NT', mode)}
        <div class="person-updated">${updated}</div>
        ${delBtn}
      </div>`;
    }).join('');

    return `<section class="act-section">
      <h2 class="act-heading act-heading-${mode}">${modeKor} 진도</h2>
      <div class="person-list">${rowsHtml}</div>
    </section>`;
  }).join('');
}

/* 해당 성경(u)에 그 활동(mode) 기록이 실제로 있는지 (0장이면 기록 없는 것으로 취급) */
function hasActivity(u, mode){
  if(!u) return false;
  const cnt = mode==='read' ? u.read_count : u.write_count;
  return cnt > 0;
}

/* 구약 또는 신약 진도 한 칸 — 그 활동을 안 했으면 '기록 없음'으로 통일 표시 */
function testamentCell(u, testament, mode){
  const testKor = testament==='OT' ? '구약' : '신약';
  const posClass = testament==='OT' ? 't-ot' : 't-nt';
  if(!hasActivity(u, mode)){
    return `<div class="t-cell ${posClass} t-empty"><span class="t-label">${testKor}</span><span class="t-none">기록 없음</span></div>`;
  }
  const pct = mode==='read' ? u.read_percent : u.write_percent;
  const cnt = mode==='read' ? u.read_count : u.write_count;
  const barColor = mode==='read' ? 'var(--navy)' : 'var(--gold)';
  return `<div class="t-cell ${posClass}">
    <span class="t-label">${testKor}</span>
    <div class="bar-mini"><i style="width:${pct}%;background:${barColor}"></i></div>
    <span class="pct">${pct}% <span class="cnt">(${cnt}/${u.total_chapters})</span></span>
  </div>`;
}

function renderSummary(){
  const readPeople = people.filter(p => hasActivity(p.ot,'read') || hasActivity(p.nt,'read'));
  const writePeople = people.filter(p => hasActivity(p.ot,'write') || hasActivity(p.nt,'write'));

  // 평균은 실제로 그 활동을 한 성경(구약/신약 각 항목)만 대상으로 계산 — 기록 없음(0)은 제외
  const readEntries = rows.filter(u => u.read_count > 0);
  const writeEntries = rows.filter(u => u.write_count > 0);
  const avgRead = readEntries.length ? Math.round(readEntries.reduce((s,u)=>s+u.read_percent,0)/readEntries.length) : 0;
  const avgWrite = writeEntries.length ? Math.round(writeEntries.reduce((s,u)=>s+u.write_percent,0)/writeEntries.length) : 0;

  $('#summary').innerHTML = `
    <div class="s"><div class="v">${readPeople.length}</div><div class="k">읽기 참여자 수</div></div>
    <div class="s"><div class="v">${avgRead}%</div><div class="k">평균 읽기 진도</div></div>
    <div class="s"><div class="v">${writePeople.length}</div><div class="k">필사 참여자 수</div></div>
    <div class="s"><div class="v">${avgWrite}%</div><div class="k">평균 필사 진도</div></div>
  `;
}

function esc(s){
  return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}
</script>
</body>
</html>
